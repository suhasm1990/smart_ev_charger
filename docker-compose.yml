services:
  ev-charger:
    build: .
    container_name: smart_ev_charger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Smart EV Charger Bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-bot@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-Smart EV Charger Bot}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-bot@users.noreply.github.com}
    volumes:
      - ./:/app
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # The daemon touches the heartbeat file only on a SUCCESSFUL cycle, so a
      # wedged or permanently failing loop turns unhealthy (a stale log did not:
      # the "SKIP CYCLE" line kept refreshing the log's mtime forever).
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p='/app/logs/heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 2400 else 1)\""]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
